<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Temps Céleste Relatif</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Le Temps Céleste Relatif</h1>
    <p class="subtitle">Dynamic Solar Arc System</p>
  </header>

  <main class="container">
    <div class="card clock-container">
      <h2>Solar Longitude Arc</h2>
      <canvas id="clockCanvas" width="280" height="280"></canvas>
      <div id="digitalTime" class="digital-time">00° 00′ 00″</div>
    </div>

    <div class="card">
      <h2>Astronomical Position</h2>
      <div class="metric-row">
        <span class="metric-label">Apparent Solar Longitude (λ)</span>
        <span id="sunLong" class="metric-value highlight">0.0000°</span>
      </div>
      <div class="metric-row">
        <span class="metric-label">VSOP87 Perturbation</span>
        <span id="vsopCorr" class="metric-value">0.00″</span>
      </div>
      <div class="metric-row">
        <span class="metric-label">Precession &amp; Nutation</span>
        <span id="precNutCorr" class="metric-value">0.00″</span>
      </div>
      <div class="metric-row">
        <span class="metric-label">Delta T (ΔT)</span>
        <span id="deltaTVal" class="metric-value">0.00 s</span>
      </div>
      <div class="metric-row">
        <span class="metric-label">Orbital Velocity Scale</span>
        <span id="stepScale" class="metric-value highlight">1.000000x</span>
      </div>
      
      <button id="themeToggle" class="btn-minimal">Cycle Theme</button>
    </div>
  </main>

  <!-- Cache-busting version parameter added -->
  <script src="app.js?v=1.0.1"></script>
</body>
</html>
